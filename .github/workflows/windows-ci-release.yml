name: Windows Native Build & Zero-Bug Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci-release.yml'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-verify-windows:
    name: Windows x64 Native MSVC Build & Self-Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows -> target"

      - name: Run full unit & 2MB performance tests (Unified Edition, zero warnings)
        shell: pwsh
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo test --manifest-path windows/Cargo.toml -- --nocapture

      - name: Build ultra-lightweight native Release binary (One iClip)
        shell: pwsh
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          cargo build --manifest-path windows/Cargo.toml --release
          Copy-Item windows/target/release/iClip.exe dist-win/iClip.exe

      - name: Execute real Win32 GUI + DWM + CF_HTML Clipboard end-to-end self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist-win/iClip.exe" -ArgumentList @("--self-test", "dist-win/selftest.json") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "iClip.exe --self-test failed with code $($p.ExitCode)" }
          Get-Content dist-win/selftest.json

      - name: Package Windows release archive & compute SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win/stage | Out-Null
          Copy-Item dist-win/iClip.exe dist-win/stage/iClip.exe
          Compress-Archive -Path dist-win/stage/iClip.exe -DestinationPath dist-win/iClip-Windows-x64.zip -Force

          Get-ChildItem dist-win/*.exe, dist-win/*.zip | Select-Object Name, @{Name="KB";Expression={[math]::Round($_.Length / 1KB, 1)}}
          Get-FileHash dist-win/*.zip -Algorithm SHA256 | Format-List

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iclip-windows-x64-bundles
          path: |
            dist-win/iClip-Windows-x64.zip
            dist-win/selftest.json
            dist-win/preview-*.png
          if-no-files-found: error
